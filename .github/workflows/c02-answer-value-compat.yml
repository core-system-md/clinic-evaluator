name: C-02 answer value compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20261013110000_c02_allow_answer_value_70.sql"
      - "tests/c02-answer-value-compat-harness.sql"
      - "tests/c02-answer-value-compat.test.mjs"
      - ".github/workflows/c02-answer-value-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c02-node-contract:
    name: C-02 migration source contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/c02-answer-value-compat.test.mjs

  c02-disposable-postgres:
    name: C-02 disposable PostgreSQL constraint verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -f tests/c02-answer-value-compat-harness.sql
