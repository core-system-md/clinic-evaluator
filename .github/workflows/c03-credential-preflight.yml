name: C-03 Credential Preflight — Read-only

# Diagnostic only. Never deploys functions, registers releases, changes the gate, or writes Production data.
# Run manually from Actions to compare repository-scoped secrets with production-e2e environment-scoped secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c03-credential-preflight
  cancel-in-progress: false

jobs:
  repository-secret-scope:
    name: Check repository-scoped credentials (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://oaqpzaarppccbnepffxx.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      C03_OWNER_JWT: ${{ secrets.C03_OWNER_JWT }}
    steps:
      - name: Validate repository-scoped secret injection without revealing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY C03_OWNER_JWT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository scope: $name is empty or unavailable to this workflow."
              missing=1
            else
              echo "Repository scope: $name is injected (value hidden)."
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Repository-scoped secret injection failed."
            exit 1
          fi
      - name: Perform read-only Production credential and state check
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl --fail --silent --show-error             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             "$SUPABASE_URL/rest/v1/assessment_config_release_settings?select=singleton,enabled&singleton=eq.true")"
          echo "$settings" | jq -e 'length == 1 and .[0].singleton == true and .[0].enabled == false' >/dev/null
          families="$(curl --fail --silent --show-error             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             "$SUPABASE_URL/rest/v1/assessment_families?select=slug,current_published_version_id&current_published_version_id=not.is.null&order=slug.asc")"
          expected='["admin-reception-assessment","clinic-performance","comprehensive-clinic-assessment","medical-team-assessment","patient-journey"]'
          echo "$families" | jq -e --argjson expected "$expected" 'map(.slug) == $expected and all(.[]; .current_published_version_id != null)' >/dev/null
          echo "Repository scope passed: read-only API authentication and expected disabled-gate/family inventory verified."

  production-e2e-environment-secret-scope:
    name: Check production-e2e environment credentials (read-only)
    runs-on: ubuntu-latest
    environment: production-e2e
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://oaqpzaarppccbnepffxx.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      C03_OWNER_JWT: ${{ secrets.C03_OWNER_JWT }}
    steps:
      - name: Validate environment-scoped secret injection without revealing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY C03_OWNER_JWT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::production-e2e environment scope: $name is empty or unavailable to this job."
              missing=1
            else
              echo "production-e2e environment scope: $name is injected (value hidden)."
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::production-e2e environment secret injection failed. An environment-level secret with the same name can override a repository secret."
            exit 1
          fi
      - name: Perform read-only Production credential and state check
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl --fail --silent --show-error             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             "$SUPABASE_URL/rest/v1/assessment_config_release_settings?select=singleton,enabled&singleton=eq.true")"
          echo "$settings" | jq -e 'length == 1 and .[0].singleton == true and .[0].enabled == false' >/dev/null
          families="$(curl --fail --silent --show-error             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             "$SUPABASE_URL/rest/v1/assessment_families?select=slug,current_published_version_id&current_published_version_id=not.is.null&order=slug.asc")"
          expected='["admin-reception-assessment","clinic-performance","comprehensive-clinic-assessment","medical-team-assessment","patient-journey"]'
          echo "$families" | jq -e --argjson expected "$expected" 'map(.slug) == $expected and all(.[]; .current_published_version_id != null)' >/dev/null
          echo "production-e2e environment scope passed: read-only API authentication and expected disabled-gate/family inventory verified."
