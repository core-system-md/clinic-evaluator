name: P3 kernel verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p3-kernel-verification.yml"
      - "supabase/functions/assessment-access/p3-score-engine.mts"
      - "tests/p3-structured-result.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - "supabase/functions/assessment-access/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p3-kernel-verification.yml"
      - "supabase/functions/assessment-access/p3-score-engine.mts"
      - "tests/p3-structured-result.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p3-kernel:
    name: P3 isolated kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify package metadata
        run: node --version && npm --version

      - name: Run P3 kernel and contract tests
        run: node --experimental-strip-types --test tests/p3-structured-result.test.mjs tests/p3-response-interpretation-registry.test.mjs tests/p3-aggregation-engine.test.mjs tests/p3-consistency-engine.test.mjs tests/p3-criticality-coverage-engine.test.mjs tests/p3-structured-result-v1.test.mjs tests/p3-scorer-v1.test.mjs tests/p3-historical-reconciliation.test.mjs

  full-tests:
    name: Full Node test suite (baseline audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full Node test suite
        run: npm test

      - name: Note
        if: failure()
        run: echo "This job is a baseline audit; failures are reported explicitly and are not masked."
