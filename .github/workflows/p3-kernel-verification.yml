name: P3 kernel verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p3-kernel-verification.yml"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - "supabase/functions/assessment-access/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p3-kernel-verification.yml"
      - "supabase/functions/assessment-access/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p3-kernel:
    name: P3 isolated kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify package metadata
        run: node --version && npm --version

      - name: Check browser runtime syntax
        run: node --check assets/js/app.js

      - name: Run P3 kernel, ownership and contract tests
        run: node --experimental-strip-types --test tests/p3-response-interpretation-registry.test.mjs tests/p3-aggregation-engine.test.mjs tests/p3-consistency-engine.test.mjs tests/p3-criticality-coverage-engine.test.mjs tests/p3-structured-result-v1.test.mjs tests/p3-scorer-v1.test.mjs tests/p3-integrated-scorer-v1.test.mjs tests/p3-historical-reconciliation.test.mjs tests/p3-shadow-replay-current-sessions.test.mjs tests/p3-gate-e-contract.test.mjs tests/p3-overall-score-projection.test.mjs tests/p3-production-contract.test.mjs tests/p3-engine-ownership.test.mjs tests/wp03-configuration-contract.test.mjs tests/wp05-report-interpretation.test.mjs tests/wp06-report-validation.test.mjs tests/wp07-report-text-linkage.test.mjs tests/server-scoring-parity.test.js

  full-tests:
    name: Full Node test suite (baseline audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full Node test suite
        run: npm test

      - name: Note
        if: failure()
        run: echo "This job is a baseline audit; failures are reported explicitly and are not masked."


  p4-protected-local:
    name: P4 protected completion (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load P4 SQL and protected fixture
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -f tests/p4-protected-function-harness.sql

      - name: Run two concurrent protected finalizations
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:5432/postgres"
          cat > /tmp/p4-complete.sql <<'SQL'
          select public.complete_p4_assessment_session(
            '22222222-2222-4222-8222-222222222222'::uuid,
            'p4-fixture-token-hash',
            '33333333-3333-4333-8333-333333333333'::uuid,
            (select submission_fingerprint from public.sessions where id='22222222-2222-4222-8222-222222222222'::uuid),
            88.5, 'P4', '[]'::jsonb, 1, 1,
            'P3_SCORER_V1', 'P3_AGGREGATION_V1', 'p4-fixture-digest',
            jsonb_build_object(
              'schemaVersion','P3_STRUCTURED_RESULT_V1',
              'status','PRODUCTION',
              'identity',jsonb_build_object(
                'resultId','55555555-5555-4555-8555-555555555555',
                'sessionId','22222222-2222-4222-8222-222222222222',
                'assessmentTypeId','44444444-4444-4444-8444-444444444444',
                'assessmentVersion','1'
              ),
              'provenance',jsonb_build_object(
                'interpretationVersion','1',
                'scoringEngineVersion','P3_SCORER_V1',
                'scoringContractVersion','P3_AGGREGATION_V1',
                'assessmentConfigDigest','p4-fixture-digest'
              )
            )
          );
          SQL
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/p4-complete.sql > /tmp/p4-a.log &
          A=$!
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/p4-complete.sql > /tmp/p4-b.log &
          B=$!
          wait "$A"
          wait "$B"
          cat /tmp/p4-a.log
          cat /tmp/p4-b.log

      - name: Assert exactly-once protected usage and idempotent retry
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          do $test$
          declare
            v_used integer;
            v_results integer;
            v_state text;
            v_consumed timestamptz;
            v_retry jsonb;
          begin
            select used_count into v_used from public.assessment_users
             where id='33333333-3333-4333-8333-333333333333'::uuid;
            select count(*) into v_results from public.assessment_results
             where session_id='22222222-2222-4222-8222-222222222222'::uuid;
            select submission_state, usage_consumed_at into v_state, v_consumed
              from public.sessions where id='22222222-2222-4222-8222-222222222222'::uuid;

            if v_used <> 1 then raise exception 'Expected used_count=1, got %', v_used; end if;
            if v_results <> 1 then raise exception 'Expected exactly one result, got %', v_results; end if;
            if v_state <> 'completed' then raise exception 'Expected completed session, got %', v_state; end if;
            if v_consumed is null then raise exception 'usage_consumed_at was not set'; end if;

            select public.complete_p4_assessment_session(
              '22222222-2222-4222-8222-222222222222'::uuid,
              'p4-fixture-token-hash',
              '33333333-3333-4333-8333-333333333333'::uuid,
              (select submission_fingerprint from public.sessions where id='22222222-2222-4222-8222-222222222222'::uuid),
              88.5, 'P4', '[]'::jsonb, 1, 1,
              'P3_SCORER_V1', 'P3_AGGREGATION_V1', 'p4-fixture-digest',
              (select result from public.assessment_results where session_id='22222222-2222-4222-8222-222222222222'::uuid)
            ) into v_retry;

            if coalesce((v_retry->>'already_completed')::boolean, false) is not true
              then raise exception 'Retry was not idempotent: %', v_retry; end if;
            if (select used_count from public.assessment_users where id='33333333-3333-4333-8333-333333333333'::uuid) <> 1
              then raise exception 'Retry changed used_count'; end if;
          end $test$;
          SQL
