name: C-03 guarded Production release and bounded E2E
# Explicitly dispatched, confirmation-gated release; requires a verified GitHub OIDC workload identity.

on:
  workflow_dispatch:
    inputs:
      confirm_production_release:
        description: "Type ENABLE-C03-PRODUCTION to authorize this guarded Production release"
        required: true
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: c03-production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production_release == 'ENABLE-C03-PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production-e2e
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      SUPABASE_PROJECT_REF: oaqpzaarppccbnepffxx
      SUPABASE_URL: https://oaqpzaarppccbnepffxx.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      C03_PRODUCTION_RELEASE_CONFIRMATION: ${{ inputs.confirm_production_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse stale release commit before any Production operation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api repos/core-system-md/clinic-evaluator/commits/main --jq .sha)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "::error::This run is not for the exact current main SHA; refusing deployment."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run digest, attestation, and release sequencing tests
        run: node --test tests/c03-config-digest-coverage.test.js tests/c03-release-verifier-contract.test.js tests/c03-runtime-attestation.test.mjs tests/c03-production-release.test.mjs tests/c03-github-oidc-token.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run actual protected and public Edge handler tests
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-only-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-only-service-role-key
        run: deno test --no-check --allow-env --allow-net tests/c03-release-verifier-handler.test.ts tests/c03-oidc-handler-auth.test.ts tests/c03-github-oidc-claims.test.ts tests/c03-protected-edge-completion.test.ts tests/c03-edge-handler-regression.test.ts
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load canonical admin authorization functions
        run: node tests/c03-load-real-admin-auth.mjs
      - name: Run disposable PostgreSQL release and authorization harness
        run: psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -f tests/c03-hybrid-config-release-harness.sql
      - name: Validate credentials and Production release preconditions before deployment
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then echo "::error::Required GitHub Actions secret is missing: $name"; exit 1; fi
          done
          if [ "$SUPABASE_PROJECT_REF" != "oaqpzaarppccbnepffxx" ] || [ "$SUPABASE_URL" != "https://oaqpzaarppccbnepffxx.supabase.co" ]; then
            echo "::error::Production project identity mismatch"; exit 1
          fi
          if [ "$C03_PRODUCTION_RELEASE_CONFIRMATION" != "ENABLE-C03-PRODUCTION" ]; then
            echo "::error::Explicit C-03 Production confirmation is missing"; exit 1
          fi
          settings="$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/assessment_config_release_settings?select=singleton,enabled&singleton=eq.true")"
          echo "$settings" | jq -e 'length == 1 and .[0].singleton == true and .[0].enabled == false' >/dev/null
          families="$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/assessment_families?select=slug,current_published_version_id&current_published_version_id=not.is.null&order=slug.asc")"
          expected='["admin-reception-assessment","clinic-performance","comprehensive-clinic-assessment","medical-team-assessment","patient-journey"]'
          echo "$families" | jq -e --argjson expected "$expected" 'map(.slug) == $expected and all(.[]; .current_published_version_id != null)' >/dev/null
          echo "Production preflight passed: migration tables exist, gate is disabled, and the exact five-family inventory is present."
      - name: Verify OIDC release RPC migration before any deployment or writes
        shell: bash
        run: |
          set -euo pipefail
          reply="$(curl --silent --show-error --write-out         run: node .github/scripts/c03-release-attestation.mjs prepare
      - name: Select one current published version for read-only attestation
        id: attestation_target
        shell: bash
        run: |
          set -euo pipefail
          rows="$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/assessment_families?select=current_published_version_id&current_published_version_id=not.is.null&order=slug.asc&limit=1")"
          id="$(echo "$rows" | jq -r '.[0].current_published_version_id // empty')"
          test -n "$id"
          echo "assessment_type_id=$id" >> "$GITHUB_OUTPUT"
      - name: Wait for both Edge bundles deployed from this exact attested checkout
        env:
          C03_ASSESSMENT_TYPE_ID: ${{ steps.attestation_target.outputs.assessment_type_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if node .github/scripts/c03-release-attestation.mjs verify; then
              echo "Both deployed Edge identities match this exact main commit."
              exit 0
            fi
            echo "Waiting for both Edge functions to be deployed from the prepared checkout (attempt $attempt/60)."
            sleep 20
          done
          echo "::error::Timed out waiting for the exact attested Edge bundles; no release writes were attempted."
          exit 1
      - name: Register, verify, activate all five current releases, then enable the gate
        id: production_release
        run: node .github/scripts/c03-production-release.mjs > c03-production-release-result.json
      - name: Verify persisted gate, workflow audit identity, and five active release pointers
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/assessment_config_release_settings?select=singleton,enabled,enabled_by_workflow_run_id,enabled_by_workflow_sha&singleton=eq.true")"
          echo "$settings" | jq -e --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" 'length == 1 and .[0].enabled == true and .[0].enabled_by_workflow_run_id == $run and .[0].enabled_by_workflow_sha == $sha' >/dev/null
          families="$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/assessment_families?select=slug,current_published_version_id,current_release_id&current_published_version_id=not.is.null&order=slug.asc")"
          echo "$families" | jq -e 'length == 5 and all(.[]; .current_release_id != null)' >/dev/null
          echo "C-03 gate is enabled and all five current published families have active release IDs."
      - name: Upload Production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c03-production-release-evidence
          path: c03-production-release-result.json
          if-no-files-found: warn

  bounded-e2e:
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production-e2e
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://oaqpzaarppccbnepffxx.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EDGE_URL: https://oaqpzaarppccbnepffxx.supabase.co/functions/v1/assessment-access
      ALLOW_LIVE_E2E: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded live completion E2E for both established public V1 families
        id: live_e2e
        run: node .github/scripts/c02-value70-live-e2e.mjs
      - name: Clean up only this run's exact synthetic IDs and verify zero residue
        id: cleanup
        if: ${{ always() && steps.live_e2e.outcome != 'skipped' }}
        run: node .github/scripts/c03-production-e2e-cleanup.mjs
      - name: Verify C-03 gate remains enabled after E2E cleanup
        if: ${{ always() && steps.cleanup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/assessment_config_release_settings?select=singleton,enabled&singleton=eq.true")"
          echo "$settings" | jq -e 'length == 1 and .[0].enabled == true' >/dev/null
      - name: Upload bounded E2E and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c03-bounded-e2e-cleanup-evidence
          path: c02-value70-live-e2e-result.json
          if-no-files-found: warn
\\n%{http_code}' \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
