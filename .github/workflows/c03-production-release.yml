name: C-03 guarded Production configuration release
# Explicitly dispatched, confirmation-gated configuration release; requires verified GitHub OIDC workload identity.

on:
  workflow_dispatch:
    inputs:
      confirm_production_release:
        description: "Type ENABLE-C03-PRODUCTION to authorize this guarded Production release"
        required: true
        type: string
        default: ""
      preflight_only:
        description: "Validate the live GitHub OIDC identity only; do not perform Production operations"
        required: false
        type: boolean
        default: false
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: c03-production-release
  cancel-in-progress: false

jobs:
  oidc-preflight:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
         inputs.confirm_production_release == 'ENABLE-C03-PRODUCTION') ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request == null &&
         github.actor == 'core-system-md' &&
         github.event.comment.body == 'ENABLE-C03-PRODUCTION')
      }}
    runs-on: ubuntu-latest
    environment: production-e2e
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify signed OIDC token and allowlisted dispatcher claims without logging token
        run: deno run --allow-env --allow-net .github/scripts/c03-oidc-preflight.ts

  release:
    needs: oidc-preflight
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
         inputs.confirm_production_release == 'ENABLE-C03-PRODUCTION' &&
         inputs.preflight_only != true) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request == null &&
         github.actor == 'core-system-md' &&
         github.event.comment.body == 'ENABLE-C03-PRODUCTION')
      }}
    runs-on: ubuntu-latest
    environment: production-e2e
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 35
    env:
      SUPABASE_PROJECT_REF: oaqpzaarppccbnepffxx
      SUPABASE_URL: https://oaqpzaarppccbnepffxx.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      C03_PRODUCTION_RELEASE_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production_release || github.event.comment.body }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse stale release commit before any Production operation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api repos/core-system-md/clinic-evaluator/commits/main --jq .sha)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "::error::This run is not for the exact current main SHA; refusing deployment."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare immutable runtime attestation for this exact main commit
        run: node .github/scripts/c03-release-attestation.mjs prepare
      - name: Wait for both Edge bundles deployed from this exact attested checkout
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if node .github/scripts/c03-release-attestation.mjs verify; then
              echo "Both deployed Edge identities match this exact main commit."
              exit 0
            fi
            echo "Waiting for both Edge functions to be deployed from the prepared checkout (attempt $attempt/60)."
            sleep 20
          done
          echo "::error::Timed out waiting for the exact attested Edge bundles; no release writes were attempted."
          exit 1
      - name: Register, verify, activate all five current releases, then enable the gate
        id: production_release
        run: node .github/scripts/c03-production-release.mjs > c03-production-release-result.json
      - name: Verify persisted gate, workflow audit identity, and five active release pointers
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/assessment_config_release_settings?select=singleton,enabled,enabled_by_workflow_run_id,enabled_by_workflow_sha&singleton=eq.true")"
          echo "$settings" | jq -e --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" 'length == 1 and .[0].enabled == true and .[0].enabled_by_workflow_run_id == $run and .[0].enabled_by_workflow_sha == $sha' >/dev/null
          families="$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/assessment_families?select=slug,current_published_version_id,current_release_id&current_published_version_id=not.is.null&order=slug.asc")"
          echo "$families" | jq -e 'length == 5 and all(.[]; .current_release_id != null)' >/dev/null
          echo "C-03 gate is enabled and all five current published families have active release IDs."
      - name: Upload Production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c03-production-release-evidence
          path: c03-production-release-result.json
          if-no-files-found: warn
