name: C-03 hybrid configuration release gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/c03-hybrid-config-release.yml"
      - "supabase/functions/assessment-access/**"
      - "supabase/migrations/20261015100000_c03_hybrid_config_release_gate.sql"
      - "tests/c03-hybrid-config-release.test.js"
      - "tests/c03-hybrid-config-release-harness.sql"
      - "tests/c03-interpretation-runtime-provenance.test.js"
      - "tests/c03-full-config-digest.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: C-03 release contract and deterministic digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/c03-hybrid-config-release.test.js tests/c03-full-config-digest.test.js tests/c03-interpretation-runtime-provenance.test.js
  postgres-release-state-machine:
    name: C-03 release lifecycle, drift, and publication gate (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare deterministic SQL-only release fixture
        run: |
          cat > /tmp/c03-release-payload.json <<'JSON'
          {"p_assessment_type_id":"cccccccc-cccc-4ccc-8ccc-cccccccccccc","p_interpretation_version":1,"p_registry_digest":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","p_source_commit_sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","p_edge_release_ref":"assessment-access-c03-registry-attestation-v1","p_option_manifest":[{"question_code":"Q1","option_id":"ffffffff-ffff-4fff-8fff-ffffffffffff","option_index":0,"source_option_value":0},{"question_code":"Q1","option_id":"11111111-1111-4111-8111-111111111111","option_index":1,"source_option_value":1}]}
          JSON
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migration and exercise full-config release state machine
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -v release_payload="$(cat /tmp/c03-release-payload.json)" \
            -f tests/c03-hybrid-config-release-harness.sql
