name: C-03 hybrid config release gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/c03-hybrid-config-release.yml"
      - "supabase/migrations/20261015100000_c03_hybrid_config_release_gate.sql"
      - "tests/c03-hybrid-config-release-harness.sql"
      - "supabase/functions/assessment-access/engine.ts"
      - "tests/c03-config-digest-coverage.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-state-machine:
    name: C-03 release state machine (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -f tests/c03-hybrid-config-release-harness.sql

  digest-contract:
    name: C-03 full runtime digest coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/c03-config-digest-coverage.test.js
