name: C-03 hybrid config release gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/c03-hybrid-config-release.yml"
      - "supabase/migrations/20261015100000_c03_hybrid_config_release_gate.sql"
      - "tests/c03-hybrid-config-release-harness.sql"
      - "supabase/functions/assessment-access/**"
      - "supabase/functions/assessment-config-release/**"
      - ".github/scripts/c03-*.mjs"
      - "tests/c03-config-digest-coverage.test.js"
      - "tests/c03-release-verifier-contract.test.js"
      - "tests/c03-release-verifier-handler.test.ts"
      - "tests/c03-runtime-attestation.test.mjs"
      - "tests/c03-production-release.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-state-machine:
    name: C-03 release state machine (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: node tests/c03-load-real-admin-auth.mjs
      - run: psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -f tests/c03-hybrid-config-release-harness.sql

  digest-contract:
    name: C-03 full runtime digest coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/c03-config-digest-coverage.test.js tests/c03-release-verifier-contract.test.js tests/c03-runtime-attestation.test.mjs tests/c03-production-release.test.mjs


  release-verifier-handler:
    name: C-03 owner-authenticated verifier handler (isolated fake backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_ANON_KEY: "test-only-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "test-only-service-role-key"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-check --allow-env --allow-net tests/c03-release-verifier-handler.test.ts
