name: WP-09 obsolete engine references

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "assets/js/**"
      - "admin/**"
      - "supabase/functions/**"
      - "tests/wp-09-obsolete-engine-references.test.mjs"
      - "documentation/governance/WP-09-OBSOLETE-ENGINE-REFERENCES-2026-10-08.md"
      - ".github/workflows/wp-09-obsolete-engine-references.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp-09-contract:
    name: WP-09 obsolete engine reference contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/wp-09-obsolete-engine-references.test.mjs
