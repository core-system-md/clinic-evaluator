name: C-03 full configuration release digest

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/c03-full-config-release-digest.yml"
      - "supabase/migrations/20261015130000_c03_full_configuration_release_digest.sql"
      - "tests/c03-full-config-release-digest-harness.sql"
      - ".github/scripts/c03-generate-release-payload.cjs"
      - "tests/c03-release-payload-generator.test.js"
      - "tests/fixtures/c03-release-*.json"
      - "supabase/functions/assessment-access/interpretation-release-provenance.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c03-full-config-release-digest:
    name: Full config digest and drift gate (disposable PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Test deterministic release payload generator
        run: node --test tests/c03-release-payload-generator.test.js
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migration and exercise full configuration digest on disposable PostgreSQL
        run: psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -f tests/c03-full-config-release-digest-harness.sql
