name: C-03 full configuration release digest

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/c03-full-config-release-digest.yml"
      - "supabase/migrations/20261015130000_c03_full_configuration_release_digest.sql"
      - "tests/c03-full-config-release-digest-harness.sql"
      - ".github/scripts/c03-generate-release-payload.cjs"
      - ".github/scripts/c03-export-assessment-release-snapshot.sql"
      - "documentation/architecture/C-03-RELEASE-OPERATIONS-RUNBOOK-2026-10-15.md"
      - "tests/c03-release-payload-generator.test.js"
      - "tests/fixtures/c03-release-*.json"
      - "supabase/functions/assessment-access/interpretation-release-provenance.mjs"
      - "supabase/functions/assessment-access/index.ts"
      - "supabase/functions/assessment-access/engine.ts"
      - "tests/c03-protected-edge-handler.integration.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c03-full-config-release-digest:
    name: Full config digest and drift gate (disposable PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Check changed Edge and release generator syntax
        run: |
          node --experimental-strip-types --check supabase/functions/assessment-access/index.ts
          node --experimental-strip-types --check supabase/functions/assessment-access/engine.ts
          node --check supabase/functions/assessment-access/interpretation-release-provenance.mjs
          node --check .github/scripts/c03-generate-release-payload.cjs
      - uses: denoland/setup-deno@v2
      - name: Test protected Edge handler and strict pre-session release gate
        run: deno test --no-check --allow-net --allow-env --allow-read tests/c03-protected-edge-handler.integration.test.ts
      - name: Test deterministic release payload generator
        run: node --test tests/c03-release-payload-generator.test.js
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migration and exercise full configuration digest on disposable PostgreSQL
        run: psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -f tests/c03-full-config-release-digest-harness.sql
