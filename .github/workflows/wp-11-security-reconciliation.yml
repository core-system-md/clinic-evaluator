name: WP-11 security/database reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261018120000_wp11_security_database_reconciliation.sql"
      - "tests/wp-11-security-reconciliation.test.js"
      - "tests/wp-11-security-reconciliation-harness.sql"
      - ".github/workflows/wp-11-security-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261018120000_wp11_security_database_reconciliation.sql"
      - "tests/wp-11-security-reconciliation.test.js"
      - "tests/wp-11-security-reconciliation-harness.sql"
      - ".github/workflows/wp-11-security-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp11-node-contract:
    name: WP-11 migration and test contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/wp-11-security-reconciliation.test.js

  wp11-disposable-postgres:
    name: WP-11 privilege and identity checks (disposable PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/wp-11-security-reconciliation.test.js
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migration and assert privileges/policy behavior in disposable PostgreSQL
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -f tests/wp-11-security-reconciliation-harness.sql
