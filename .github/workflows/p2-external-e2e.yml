name: P2 external E2E verification

on:
  workflow_dispatch:
    inputs:
      assessment_slug:
        description: "Assessment family slug to test"
        required: false
        default: "admin-reception-assessment"

permissions:
  contents: read

jobs:
  external-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDGE_URL: https://oaqpzaarppccbnepffxx.supabase.co/functions/v1/assessment-access
      ASSESSMENT_SLUG: ${{ inputs.assessment_slug }}
      ALLOW_LIVE_E2E: ${{ secrets.ALLOW_LIVE_E2E }}
    steps:
      - uses: actions/checkout@v4

      - name: Run production external E2E test
        run: node tests/external-assessment-access.mjs

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-external-e2e-evidence
          path: p2-external-e2e-result.json
          if-no-files-found: ignore

  p3-production-e2e:
    name: P3 production E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        assessment_slug:
          - admin-reception-assessment
          - clinic-performance
          - comprehensive-clinic-assessment
          - medical-team-assessment
          - patient-journey
    env:
      EDGE_URL: https://oaqpzaarppccbnepffxx.supabase.co/functions/v1/assessment-access
      ASSESSMENT_SLUG: ${{ matrix.assessment_slug }}
      ALLOW_LIVE_E2E: ${{ secrets.ALLOW_LIVE_E2E }}
    steps:
      - uses: actions/checkout@v4

      - name: Run P3 live completion E2E
        run: node tests/p3-production-external-e2e.mjs

      - name: Upload P3 E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-production-e2e-${{ matrix.assessment_slug }}
          path: p3-production-e2e-result.json
          if-no-files-found: ignore
