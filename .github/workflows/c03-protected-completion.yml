name: C-03 protected completion regression

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/c03-protected-completion.yml"
      - "tests/c03-protected-completion-regression.test.js"
      - "tests/wp-04-structured-result-persistence-harness.sql"
      - "supabase/functions/assessment-access/**"
      - "supabase/migrations/20261009164951_structured_result_authority.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c03-regression-contract:
    name: C-03 route and report projection regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/c03-protected-completion-regression.test.js

  protected-structured-result:
    name: C-03 protected Structured Result RPC (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -f tests/wp-04-structured-result-persistence-harness.sql
