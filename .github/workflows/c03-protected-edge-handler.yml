name: C-03 protected Edge handler regression

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/c03-protected-edge-handler.yml"
      - "supabase/functions/assessment-access/**"
      - "tests/c03-protected-edge-completion.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-completion-handler:
    name: Actual protected completion handler (isolated fake backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "test-only-service-role-key"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-check --allow-env --allow-net tests/c03-protected-edge-completion.test.ts
