name: C-02 Production value-70 E2E (agent-coordinated cleanup)

on:
  # Run automatically only when this guarded workflow changes on main.
  push:
    branches:
      - main
    paths:
      - .github/workflows/c02-value70-live-e2e.yml
  workflow_dispatch:
    inputs:
      confirm_production_write:
        description: "Type RUN-C02-VALUE70 to authorize the bounded synthetic Production E2E"
        required: true
        type: string
        default: ""

permissions:
  contents: read

jobs:
  c02-value70-live-e2e:
    if: ${{ github.event_name == 'push' || inputs.confirm_production_write == 'RUN-C02-VALUE70' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EDGE_URL: https://oaqpzaarppccbnepffxx.supabase.co/functions/v1/assessment-access
      ALLOW_LIVE_E2E: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded C-02 Production value-70 E2E (both published V1 families)
        run: node .github/scripts/c02-value70-live-e2e.mjs
      - name: Upload C-02 evidence (agent cleanup remains a separate verified gate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c02-value70-live-e2e-evidence
          path: c02-value70-live-e2e-result.json
          if-no-files-found: error
